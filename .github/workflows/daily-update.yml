name: Post daily update reply

on:
  schedule:
    # 3 tries: 12:00 AM, 1:45 AM, 2:00 AM IST (18:30, 20:15, 20:30 UTC, previous day),
    # to absorb GitHub Actions' scheduler delay. Safe to run early (even before
    # today's thread exists) because the script skips if it already has ANY
    # reply on whatever thread it matched — so it never posts onto yesterday's
    # already-answered thread by mistake, it just skips and the next run retries.
    - cron: "30 18 * * *"
    - cron: "15 20 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch: {}

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run post-update
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          THREAD_PATTERN: "Daily Updates"
