name: Post daily update reply

on:
  schedule:
    # 4 tries, 20 min apart, ~1:50-2:50 AM IST (20:20-21:20 UTC, previous day),
    # to absorb GitHub Actions' scheduler delay. The script itself skips posting
    # if it already replied, so repeated runs are harmless.
    - cron: "20 20 * * *"
    - cron: "40 20 * * *"
    - cron: "0 21 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch: {}

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run post-update
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          THREAD_PATTERN: "Daily Updates"
